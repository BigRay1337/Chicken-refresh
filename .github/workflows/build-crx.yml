name: Build signed CRX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!.github/workflows/build-crx.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Validate extension manifest
        run: test -f manifest.json

      - name: Decode signing key
        env:
          PEM_BASE64: ${{ secrets.PEM_BASE64 }}
        run: |
          if [ -z "$PEM_BASE64" ]; then
            echo "Missing repository secret PEM_BASE64. Add the base64-encoded private .pem key under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          printf '%s' "$PEM_BASE64" | base64 --decode > "$RUNNER_TEMP/extension.pem"
          chmod 600 "$RUNNER_TEMP/extension.pem"

      - name: Package extension
        run: |
          chrome --no-sandbox --headless --disable-gpu \
            --pack-extension="$GITHUB_WORKSPACE" \
            --pack-extension-key="$RUNNER_TEMP/extension.pem"
          mkdir -p dist
          cp "${GITHUB_WORKSPACE}.crx" dist/Chicken-refresh.crx
          rm -f "$RUNNER_TEMP/extension.pem"

      - name: Upload CRX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chicken-refresh-crx
          path: dist/Chicken-refresh.crx
          if-no-files-found: error
          retention-days: 30
